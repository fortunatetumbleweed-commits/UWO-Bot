[pytest]
# The suite had no config at all, which is why `pytest.mark.simulation` warned "Unknown mark"
# on every run: an unregistered marker is a typo as far as pytest knows, and a typo in a
# marker silently selects nothing.
testpaths = tests
markers =
    device: drives a REAL phone over ADB. Skipped unless --device is passed, and the only
        tests that keep the real clock — see `_sleep_advances_the_clock`.
    simulation: drives the real goal loop over recorded frames rather than unit stubs.
    functional: runs against REAL CAPTURED FRAMES from tests/stage_suite/frames, which is not
        in the repo; skips when they are absent.
    live_entry_probe: touches the live entry probe.
    live_bootstrap: touches the live position bootstrap.
    integration: drives the dispatcher or mission loop end to end. These are the expensive
        ones — run them with `-m integration`, or skip them with `-m "not integration"` while
        iterating on something local.
